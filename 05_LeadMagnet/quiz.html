<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pareto Delegation Score - Demian Ducardt</title>
<style>
body{font-family:Inter,Segoe UI,system-ui,sans-serif;background:#0b1220;color:#e8ecf1;margin:0;padding:24px}
.card{max-width:680px;margin:0 auto;background:#111c30;border:1px solid #2a3b55;border-radius:14px;padding:28px}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7fd1ff;background:#12233d;border:1px solid #2a3b55;border-radius:20px;padding:6px 14px;margin-bottom:12px}
h1{font-size:26px;margin:0 0 8px}
p{font-size:14px;color:#c4d0de}
.q{margin:18px 0;padding:16px;background:#0b1220;border-radius:10px}
.q b{display:block;margin-bottom:10px}
label{display:block;font-size:13px;margin:6px 0;cursor:pointer}
button{background:#2a7bff;color:#fff;border:0;border-radius:8px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;width:100%}
#result{display:none;margin-top:18px;padding:18px;background:#0e2a1a;border:1px solid #2ecc71;border-radius:10px}
#result a{color:#ffd166;font-weight:600}
a{color:#ffd166}
footer{margin-top:16px;font-size:12px;color:#9fb0c3}
</style>
</head>
<body>
<div class="card">
<div class="eyebrow">Free 2-minute check</div>
<h1>Pareto Delegation Score</h1>
<p>7 honest answers. Your bottleneck tier plus what to hand off first. Contact for test route: demian.ducardt@gmail.com</p>
<div id="quiz"></div>
<button onclick="score()">See my result</button>
<div id="result"></div>
<footer>Built by Demian Ducardt.</footer>
</div>
<script>
const Q=[
"Inbox owns my mornings.",
"Calendar runs me.",
"Tasks live in memory, no SOPs.",
"Team uses AI at random, no agents.",
"Follow ups slip.",
"I do 100 USD plus per hour work myself.",
"Hiring help burned me before."
];
const quiz=document.getElementById('quiz');
Q.forEach((t,i)=>{
let d=document.createElement('div');d.className='q';
d.innerHTML='<b>'+(i+1)+' of 7. '+t+'</b>'+
'<label><input type="radio" name="q'+i+'" value="0"> Never</label>'+
'<label><input type="radio" name="q'+i+'" value="1"> Sometimes</label>'+
'<label><input type="radio" name="q'+i+'" value="2"> Often</label>'+
'<label><input type="radio" name="q'+i+'" value="3"> Daily</label>';
quiz.appendChild(d);
});
function score(){
let s=0;for(let i=0;i<7;i++){let v=document.querySelector('input[name="q'+i+'"]:checked');if(v)s+=parseInt(v.value);}
let r=document.getElementById('result');r.style.display='block';
let tier=s<=7?'Starter: systems missing. Your first win is one inbox SOP.':s<=14?'Bottleneck: you are the router. Your week gives back 10 tasks.':'AI Behind: random tool use. Your fix is one operator plus agents.';
r.innerHTML='<b>Result '+s+' of 21. '+tier+'</b><br><br><a href="../06_Funnel/index.html">Get my full pack plus next step by email</a><br>Test contact: demian.ducardt@gmail.com';
}
</script>
</body>
</html>
