<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your pack is on the way - Resource - Demian Ducardt</title>
<style>
:root{--base:#0b1220;--panel:#111c30;--line:#2a3b55;--blue:#2a7bff;--sky:#7fd1ff;--gold:#ffd166;--ink:#e8ecf1;--muted:#c4d0de;--faint:#9fb0c3}
*{box-sizing:border-box}
body{font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--base);color:var(--ink);margin:0;padding:48px 20px;font-size:16px;line-height:26px}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:8px}
.box{max-width:620px;margin:0 auto;background:var(--panel);padding:32px 28px;border-radius:14px;border:1px solid var(--line);text-align:left}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);background:#12233d;border:1px solid var(--line);border-radius:20px;padding:6px 14px;margin-bottom:14px}
h1{font-size:48px;line-height:52px;font-weight:800;margin:0 0 10px;color:#fff}
p{color:var(--muted)}
.calm{width:56px;height:56px;border-radius:50%;border:2px solid var(--sky);display:grid;place-items:center;font-size:26px;color:var(--sky);margin-bottom:14px}
.resource{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:24px;margin:18px 0}
.resource b{color:#fff;display:block;margin-bottom:6px}
.resource span{color:var(--muted);font-size:14px}
.retake{display:inline-block;font-size:20px;font-weight:800;color:var(--sky);margin-top:12px;padding:12px 4px}
.retake:hover{color:#fff}
a{color:var(--gold)}
.foot{margin-top:18px;font-size:12px;color:var(--faint)}
@media(max-width:700px){h1{font-size:36px;line-height:40px}body{padding:28px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="box">
<div class="calm" aria-hidden="true">○</div>
<div class="eyebrow">Resource route</div>
<h1>Resource ready.</h1>
<p>Quiz pack sent. One email only on this route. Grow to 300k plus and the call route opens.</p>
<div class="resource"><b>Your single resource card</b><span>Delegation Score tier plus first 10 tasks plus inbox SOP. Keep it, use it, retake when workload shifts.</span></div>
<p><a class="retake" href="../05_LeadMagnet/quiz.html">Retake quiz →</a></p>
<div class="foot">Built by Demian Ducardt.</div>
</div></body></html>
